<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculator</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #0f1115; font-family: system-ui, sans-serif;
  }
  .calc {
    width: 320px; padding: 20px; border-radius: 24px;
    background: #181b22; box-shadow: 0 20px 60px rgba(0,0,0,.5);
  }
  .screen { text-align: right; padding: 10px 8px 18px; }
  #history { min-height: 20px; color: #7d8590; font-size: 14px; }
  #display { color: #fff; font-size: 44px; overflow: hidden; text-overflow: ellipsis; }
  .keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  button {
    height: 64px; border: 0; border-radius: 16px; font-size: 22px; cursor: pointer;
    background: #262b36; color: #e6edf3; transition: transform .08s, filter .15s;
  }
  button:hover { filter: brightness(1.2); }
  button:active { transform: scale(.95); }
  .op { background: #3b4252; color: #8fbcff; }
  .fn { background: #2f3441; color: #ffb86b; }
  .eq { background: #4c8dff; color: #fff; grid-column: 4; grid-row: 4 / span 2; height: auto; }
  .zero { grid-column: 1 / span 2; }
</style>
</head>
<body>
<div class="calc">
  <div class="screen">
    <div id="history"></div>
    <div id="display">0</div>
  </div>
  <div class="keys">
    <button class="fn" data-action="clear">AC</button>
    <button class="fn" data-action="back">⌫</button>
    <button class="op" data-op="/">÷</button>
    <button class="op" data-op="*">×</button>
    <button data-digit="7">7</button>
    <button data-digit="8">8</button>
    <button data-digit="9">9</button>
    <button class="op" data-op="-">−</button>
    <button data-digit="4">4</button>
    <button data-digit="5">5</button>
    <button data-digit="6">6</button>
    <button class="op" data-op="+">+</button>
    <button data-digit="1">1</button>
    <button data-digit="2">2</button>
    <button data-digit="3">3</button>
    <button class="eq" data-action="equals">=</button>
    <button class="zero" data-digit="0">0</button>
    <button data-action="dot">.</button>
  </div>
</div>

<script>
  let current = "0", first = null, op = null, fresh = false;
  const display = document.getElementById("display");
  const history = document.getElementById("history");
  const symbols = { "/": "÷", "*": "×", "-": "−", "+": "+" };

  function show() { display.textContent = current; }

  function digit(d) {
    if (fresh || current === "0") { current = d; fresh = false; }
    else current += d;
    show();
  }

  function dot() {
    if (fresh) { current = "0"; fresh = false; }
    if (!current.includes(".")) current += ".";
    show();
  }

  async function compute() {
    const res = await fetch("/calculate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ a: first, op: op, b: current })
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    return String(parseFloat(data.result.toFixed(10)));
  }

  async function operator(o) {
    try {
      if (op && !fresh) current = await compute();
      first = current; op = o; fresh = true;
      history.textContent = first + " " + symbols[o];
      show();
    } catch (e) { showError(e.message); }
  }

  async function equals() {
    if (!op) return;
    try {
      const b = current;
      const result = await compute();
      history.textContent = first + " " + symbols[op] + " " + b + " =";
      current = result; op = null; first = null; fresh = true;
      show();
    } catch (e) { showError(e.message); }
  }

  function showError(msg) {
    current = "0"; first = null; op = null; fresh = true;
    display.textContent = msg;
  }

  function clearAll() {
    current = "0"; first = null; op = null; fresh = false;
    history.textContent = ""; show();
  }

  function back() {
    if (fresh) return;
    current = current.length > 1 ? current.slice(0, -1) : "0";
    show();
  }

  document.querySelector(".keys").addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    if (b.dataset.digit) digit(b.dataset.digit);
    else if (b.dataset.op) operator(b.dataset.op);
    else if (b.dataset.action === "equals") equals();
    else if (b.dataset.action === "clear") clearAll();
    else if (b.dataset.action === "back") back();
    else if (b.dataset.action === "dot") dot();
  });

  document.addEventListener("keydown", (e) => {
    if (/^[0-9]$/.test(e.key)) digit(e.key);
    else if ("+-*/".includes(e.key)) operator(e.key);
    else if (e.key === "Enter" || e.key === "=") equals();
    else if (e.key === ".") dot();
    else if (e.key === "Backspace") back();
    else if (e.key === "Escape") clearAll();
  });
</script>
</body>
</html>
